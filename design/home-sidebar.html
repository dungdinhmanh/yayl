<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>YAYL — Home (Rail)</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/components/bubble-progress.css">
</head>
<body data-page="home" data-layout="rail" data-game="arknights" data-state="ready">
  <div class="app">
    <div class="backdrop">
      <img class="backdrop-art" data-active-art src="assets/img/arknights.png" alt="" onerror="this.classList.add('is-missing')">
      <div class="backdrop-scrim"></div>
      <div class="backdrop-grain"></div>
    </div>

    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.4 5.2a1 1 0 0 1 1.52-.86l9.1 6.8a1 1 0 0 1 0 1.72l-9.1 6.8A1 1 0 0 1 8.4 18.8V5.2Z"/></svg>
        </span>
        <div class="brand-name">YAYL</div>
      </div>
      <div class="window-controls">
        <button class="win-btn" type="button" data-window-action="minimize" data-i18n-title="window.minimize" aria-label="Thu nhỏ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button class="win-btn" type="button" data-window-action="maximize" data-i18n-title="window.maximize" aria-label="Phóng to">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        </button>
        <button class="win-btn is-close" type="button" data-window-action="close" data-i18n-title="window.close" aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </header>

    <nav class="social-rail" data-i18n-title="social.label" aria-label="Kênh chính thức">
      <a class="social-link" href="https://stellasora.global/" target="_blank" rel="noopener noreferrer" data-i18n-title="social.website" aria-label="Trang chủ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M3.8 12h16.4M12 3.8c2.3 2.3 3.4 5 3.4 8.2s-1.1 5.9-3.4 8.2c-2.3-2.3-3.4-5-3.4-8.2S9.7 6.1 12 3.8Z"/></svg>
      </a>
      <a class="social-link" href="https://x.com/StellaSoraEN" target="_blank" rel="noopener noreferrer" data-i18n-title="social.x" aria-label="X">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 4h2.9l-6.3 7.2L21.5 20h-5.8l-4.5-5.9L5.9 20H3l6.8-7.8L2.8 4h5.9l4.1 5.4L17.5 4Zm-1 14.3h1.6L7.6 5.6H5.9l10.6 12.7Z"/></svg>
      </a>
      <a class="social-link" href="https://www.facebook.com/StellaSoraEN/" target="_blank" rel="noopener noreferrer" data-i18n-title="social.facebook" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 20v-6.3h2.1l.4-2.5h-2.5V9.6c0-.7.2-1.2 1.2-1.2H16V6.2c-.3 0-1.1-.1-2-.1-2 0-3.3 1.2-3.3 3.4v1.7H8.6v2.5h2.1V20h2.8Z"/></svg>
      </a>
      <a class="social-link" href="https://discord.com/invite/stellasoraofficial" target="_blank" rel="noopener noreferrer" data-i18n-title="social.discord" aria-label="Discord">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 7.2h9.2a4 4 0 0 1 3.8 5.2l-.9 2.9a3 3 0 0 1-4.6 1.6l-.8-.7h-4.2l-.8.7a3 3 0 0 1-4.6-1.6l-.9-2.9a4 4 0 0 1 3.8-5.2Z"/><path d="M9.3 12.3h.01M14.7 12.3h.01"/></svg>
      </a>
      <a class="social-link" href="https://www.youtube.com/@StellaSoraEN" target="_blank" rel="noopener noreferrer" data-i18n-title="social.youtube" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3.4"/><path d="m10.4 9.6 4.4 2.4-4.4 2.4V9.6Z" fill="currentColor" stroke="none"/></svg>
      </a>
    </nav>

    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-scroll">
          <div class="game-list">
            <button class="game-card is-active" type="button" data-game-id="arknights" data-status="ready" title="Arknights">
              <span class="game-thumb-wrap">
                <img class="game-thumb" src="assets/img/arknights.png" alt="Arknights" onerror="this.classList.add('is-missing')">
              </span>
              <span class="game-info">
                <span class="game-name">Arknights</span>
                <span class="game-meta"><span data-card-version>042.0.0</span></span>
              </span>
            </button>
            <button class="game-card" type="button" data-game-id="stella" data-status="ready" title="Stella Sora">
              <span class="game-thumb-wrap">
                <img class="game-thumb" src="assets/img/stella.png" alt="Stella Sora" onerror="this.classList.add('is-missing')">
              </span>
              <span class="game-info">
                <span class="game-name">Stella Sora</span>
                <span class="game-meta"><span data-card-version>2.0.0</span></span>
              </span>
            </button>
          </div>

          <nav class="nav">
            <a class="nav-item is-active" href="home-sidebar.html" data-i18n-title="nav.home" aria-label="Home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
            </a>
            <a class="nav-item" href="settings.html" data-i18n-title="nav.settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.08a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3v-4h.08a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3h4v.08a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.4.45.74.85.92H21v4h-.08a1.7 1.7 0 0 0-1.52 1.08Z"/></svg>
            </a>
          </nav>
        </div>
      </aside>

      <main class="main">
        <div class="main-scroll">
          <div class="page home-page">
            <section class="home-news" id="homeNews">
              <div class="banner-card" id="newsBanner"></div>
              <div class="news-panel">
                <div class="news-tabs" id="newsTabs"></div>
                <div class="news-list" id="newsList"></div>
              </div>
            </section>

            <div class="hero-stats" id="heroStats">
              <div class="hero-stat">
                <div class="hero-stat-label" data-i18n="stats.playtime">Thời gian chơi</div>
                <div class="hero-stat-value" data-stat-playtime>126 giờ 42 phút</div>
              </div>
              <div class="hero-stat">
                <div class="hero-stat-label" data-i18n="stats.lastPlayed">Chơi lần cuối</div>
                <div class="hero-stat-value" data-stat-last>Hôm nay, 09:41</div>
              </div>
            </div>

            <div class="home-actions">
              <div class="home-action-group">
                <div class="home-play-wrap">
                  <button class="home-play" type="button" id="primaryAction">
                    <span class="home-play-icon" data-button-icon></span>
                    <span class="home-play-label" data-button-label>Chơi</span>
                  </button>
                  <div class="download-monitor" data-download-monitor hidden aria-hidden="true">
                    <div class="dm-head">
                      <span class="dm-title" data-i18n="download.monitor.title">Đang tải</span>
                      <span class="dm-pct" data-dm-pct>42%</span>
                    </div>
                    <div class="dm-row">
                      <span class="dm-label" data-i18n="download.monitor.network">Mạng</span>
                      <span class="dm-value" data-dm-net>12.4 MB/s</span>
                    </div>
                    <svg class="dm-graph" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
                      <polygon data-dm-net-area></polygon>
                      <polyline data-dm-net-line></polyline>
                    </svg>
                    <div class="dm-row">
                      <span class="dm-label" data-i18n="download.monitor.disk">Ổ cứng</span>
                      <span class="dm-value dm-io">
                        <span><em data-i18n="download.monitor.read">Đọc</em><span data-dm-read>0 KB/s</span></span>
                        <span><em data-i18n="download.monitor.write">Ghi</em><span data-dm-write>0 KB/s</span></span>
                      </span>
                    </div>
                    <svg class="dm-graph is-disk" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
                      <polygon data-dm-disk-area></polygon>
                      <polyline data-dm-disk-line></polyline>
                    </svg>
                    <div class="dm-track"><span data-dm-bar></span></div>
                    <div class="dm-meta">
                      <span data-dm-size>8.4 GB / 20.1 GB</span>
                      <span data-dm-eta>Còn lại 08:12</span>
                    </div>
                  </div>
                </div>
                <div class="home-menu" id="homeMenu">
                  <button class="home-menu-btn" type="button" id="homeMenuBtn" aria-haspopup="true" aria-expanded="false" data-i18n-title="home.menu.label" aria-label="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
                  </button>
                  <div class="home-menu-pop" id="homeMenuPop" role="menu" hidden>
                    <button class="home-menu-item" type="button" role="menuitem" data-home-action="play" data-i18n="home.action.playAnyway" hidden>Chơi ngay</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-home-action="cancel" data-i18n="home.action.cancel" hidden>Hủy</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-home-action="minimize" data-i18n="home.action.minimize" hidden>Thu nhỏ</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-home-action="retry" data-i18n="home.action.retry" hidden>Thử lại</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-i18n="home.menu.verify">Kiểm tra</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-i18n="home.menu.repair">Sửa game</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-i18n="home.menu.settings">Thiết lập game</button>
                    <button class="home-menu-item" type="button" role="menuitem" data-i18n="home.menu.shortcut">Tạo shortcut</button>
                  </div>
                </div>
              </div>
              <div class="home-action-note" id="secondaryAction" hidden>
                <span data-installed-prefix></span> <a class="home-action-link" id="secondaryLocate" href="#"></a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/vendor/anime.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/mock-i18n.js"></script>
  <script src="assets/js/bubble-progress.js"></script>
  <script src="assets/js/download-badge.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/mock-pages.js"></script>
</body>
</html>
