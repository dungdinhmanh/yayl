<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>YAYL — Home (Top tabs)</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="home" data-layout="topbar" data-game="arknights" data-state="ready">
  <div class="app topbar-mode">
    <div class="backdrop">
      <img class="backdrop-art" data-active-art src="assets/img/arknights.png" alt="" onerror="this.classList.add('is-missing')">
      <div class="backdrop-scrim"></div>
      <div class="backdrop-grain"></div>
    </div>

    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.4 5.2a1 1 0 0 1 1.52-.86l9.1 6.8a1 1 0 0 1 0 1.72l-9.1 6.8A1 1 0 0 1 8.4 18.8V5.2Z"/></svg>
        </span>
        <div class="brand-name">YAYL</div>
      </div>

      <div class="titlebar-center">
        <div class="top-tabs">
          <button class="top-tab is-active" type="button" data-game-id="arknights" title="Arknights">
            <img class="top-tab-thumb" src="assets/img/arknights.png" alt="Arknights" onerror="this.classList.add('is-missing')">
            <span class="top-tab-name">Arknights</span>
            <span class="top-tab-region">EN</span>
          </button>
          <button class="top-tab" type="button" data-game-id="stella" title="Stella Sora">
            <img class="top-tab-thumb" src="assets/img/stella.png" alt="Stella Sora" onerror="this.classList.add('is-missing')">
            <span class="top-tab-name">Stella Sora</span>
            <span class="top-tab-region">EN</span>
          </button>
        </div>
      </div>

      <div class="topbar-actions">
        <a class="icon-btn" href="download.html" data-i18n-title="nav.downloads" aria-label="Tải xuống">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </a>
        <a class="icon-btn" href="settings.html" data-i18n-title="nav.settings" aria-label="Cài đặt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.08a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3v-4h.08a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3h4v.08a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.4.45.74.85.92H21v4h-.08a1.7 1.7 0 0 0-1.52 1.08Z"/></svg>
        </a>
        <div class="window-controls">
          <button class="win-btn" type="button" data-window-action="minimize" data-i18n-title="window.minimize" aria-label="Thu nhỏ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <button class="win-btn" type="button" data-window-action="maximize" data-i18n-title="window.maximize" aria-label="Phóng to">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
          <button class="win-btn is-close" type="button" data-window-action="close" data-i18n-title="window.close" aria-label="Đóng">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="shell">
      <main class="main">
        <div class="main-scroll">
          <div class="page home-page">
            <section class="home-news" id="homeNews">
              <div class="banner-card" id="newsBanner"></div>
              <div class="news-panel">
                <div class="news-tabs" id="newsTabs"></div>
                <div class="news-list" id="newsList"></div>
              </div>
            </section>

            <div class="hero-stats" id="heroStats">
              <div class="hero-stat">
                <div class="hero-stat-label" data-i18n="stats.playtime">Thời gian chơi</div>
                <div class="hero-stat-value" data-stat-playtime>126 giờ 42 phút</div>
              </div>
              <div class="hero-stat">
                <div class="hero-stat-label" data-i18n="stats.lastPlayed">Chơi lần cuối</div>
                <div class="hero-stat-value" data-stat-last>Hôm nay, 09:41</div>
              </div>
            </div>

            <div class="game-info-card" id="gameInfoCard" hidden>
              <img class="game-info-thumb" id="gameInfoThumb" src="assets/img/arknights.png" alt="" onerror="this.classList.add('is-missing')">
              <div>
                <div class="game-info-name" id="gameInfoName">Arknights</div>
                <div class="game-info-meta">
                  <span class="mono" id="gameInfoVersion">v042.0.0</span>
                  <span id="gameInfoState">24.8 GB</span>
                  <span class="game-info-badge" id="gameInfoBadge" hidden>NEW</span>
                </div>
              </div>
            </div>

            <div class="home-actions">
              <button class="home-action-link" type="button" id="secondaryAction" hidden></button>
              <button class="home-icon-btn" type="button" id="homeSettingsBtn" data-i18n-title="nav.settings" aria-label="Cài đặt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.08a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3v-4h.08a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3h4v.08a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.4.45.74.85.92H21v4h-.08a1.7 1.7 0 0 0-1.52 1.08Z"/></svg>
              </button>
              <button class="home-play" type="button" id="primaryAction">
                <span data-button-icon></span>
                <span class="home-play-copy">
                  <span class="home-play-label" data-button-label>Chơi</span>
                  <span class="home-play-sub" data-button-sub>Sẵn sàng</span>
                </span>
              </button>
            </div>

            <div class="home-version" id="homeVersion">v042.0.0</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/mock-i18n.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/mock-pages.js"></script>
</body>
</html>
