[workspace]
resolver = "3"
members = ["crates/yayl-core", "crates/yayl-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
yayl-core = { path = "crates/yayl-core" }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
