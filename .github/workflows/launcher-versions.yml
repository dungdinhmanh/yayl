name: Launcher versions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      extract:
        description: "Unpack both installers even if the version is unchanged"
        type: boolean
        default: false
  push:
    paths:
      - launcher-versions.lock.json
      - scripts/check-launcher-versions.mjs
      - scripts/launcher-facts.mjs
      - .github/workflows/launcher-versions.yml

concurrency:
  group: launcher-versions
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.launcher }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        launcher: [arknights, stella]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Drift is the normal signal, not an error: the update job rewrites the
      # lock. Only a feed that cannot be read fails this job.
      - name: Compare ${{ matrix.launcher }} with the lock file
        run: |
          set +e
          bun scripts/check-launcher-versions.mjs ${{ matrix.launcher }}
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 1 ]; then
            echo "::notice::${{ matrix.launcher }} moved; the update job will refresh the lock"
          fi

  update-lock:
    name: update lock
    needs: check
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The standalone build, not apt's p7zip: same binary on every runner.
      # Download outside the checkout so the tarball can never reach the commit.
      - name: Install 7-Zip
        run: |
          curl -sSfL -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2301-linux-x64.tar.xz
          sudo tar -xJf /tmp/7z.tar.xz -C /usr/local/bin 7zz

      # Only launchers whose feed moved are downloaded, unless extract=true.
      - name: Refresh the lock
        run: |
          if [ "${{ inputs.extract }}" = "true" ]; then
            bun scripts/check-launcher-versions.mjs --update --extract --all
          else
            bun scripts/check-launcher-versions.mjs --update --extract
          fi

      - name: Commit the refreshed lock
        run: |
          if git diff --quiet -- launcher-versions.lock.json; then
            echo "the lock already matches the published launchers"
            exit 0
          fi
          # Prove the lock the job is about to commit still satisfies the feed.
          bun scripts/check-launcher-versions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-versions.lock.json
          git commit -m "chore(deps): refresh the launcher version lock" \
            -m "Read from the published installers: version, size, sha512, auth salt and EN API host. The build takes the protocol version and salt from this file."
          git push
