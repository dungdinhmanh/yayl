name: Launcher versions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      extract:
        description: "Unpack both installers even if the version is unchanged"
        type: boolean
        default: false
  push:
    paths:
      - launcher-versions.lock.json
      - scripts/check-launcher-versions.mjs
      - scripts/launcher-facts.mjs
      - .github/workflows/launcher-versions.yml

concurrency:
  group: launcher-versions
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.launcher }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        launcher: [arknights, stella]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare ${{ matrix.launcher }} with the lock file
        run: bun scripts/check-launcher-versions.mjs ${{ matrix.launcher }}

  update-lock:
    name: update lock
    needs: check
    if: failure() || (github.event_name == 'workflow_dispatch' && inputs.extract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The standalone build, not apt's p7zip: same binary on every runner.
      # Download outside the checkout so the tarball can never reach the PR.
      - name: Install 7-Zip
        run: |
          curl -sSfL -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2301-linux-x64.tar.xz
          sudo tar -xJf /tmp/7z.tar.xz -C /usr/local/bin 7zz

      - name: Refresh the lock
        run: |
          if [ "${{ inputs.extract }}" = "true" ]; then
            bun scripts/check-launcher-versions.mjs --update --extract --all
          else
            bun scripts/check-launcher-versions.mjs --update --extract
          fi

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/launcher-versions
          delete-branch: true
          commit-message: "chore(deps): refresh the launcher version lock"
          title: "chore(deps): refresh the launcher version lock"
          body: |
            The official launcher feed no longer matches `launcher-versions.lock.json`.

            The new installers were unpacked and read: the lock carries the new
            version, file name, size, sha512, auth salt and EN API host. The build
            takes the protocol version and salt straight from this file, so
            merging is enough to keep signing correct.

            Check the salt diff before merging; a change there means the installed
            launchers must be re-extracted for the extracted trees in `game-extracted/`.
