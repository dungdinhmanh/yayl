name: Check launcher update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      extract:
        description: "Unpack the installer even when its version is unchanged"
        type: boolean
        default: false
  push:
    paths:
      - launcher-versions.lock.json
      - scripts/check-launcher-versions.mjs
      - scripts/launcher-facts.mjs
      - .github/workflows/check-launcher-update.yml

concurrency:
  group: check-launcher-update
  cancel-in-progress: false

jobs:
  launcher:
    name: ${{ matrix.launcher }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        launcher: [arknights, stella]
    # One lock file, two writers: run the legs in turn so the second one checks
    # out the commit the first one pushed.
    concurrency:
      group: launcher-lock-write
      cancel-in-progress: false
    steps:
      # Pinned to commit SHAs: a moved tag must not change what runs here with
      # a write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Compare ${{ matrix.launcher }} with its published installer
        id: check
        run: |
          set +e
          bun scripts/check-launcher-versions.mjs ${{ matrix.launcher }}
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 0 ] && [ "${{ inputs.extract }}" != "true" ]; then
            echo "::notice::${{ matrix.launcher }} is up to date"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # Ubuntu ships 7-Zip as `7zip` (p7zip-full is a transitional package that
      # pulls it). Signed, cached, and no download from a project page.
      - name: Install 7-Zip
        if: steps.check.outputs.drift == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          7z i | head -2

      # --all re-reads the installer even when only the bytes were forced; the
      # script still rewrites nothing but this launcher's entry.
      - name: Refresh the lock
        if: steps.check.outputs.drift == 'true'
        run: |
          bun scripts/check-launcher-versions.mjs --update --extract --all ${{ matrix.launcher }}
          # Prove the rewritten entry satisfies the feed before committing it.
          bun scripts/check-launcher-versions.mjs ${{ matrix.launcher }}

      # version, size and sha512 are checked against the published feed, so they
      # are pushed directly. authSalt and apiBase are read from the installer and
      # compiled into every build, so a change to either goes through a pull
      # request that a person has to merge.
      - name: Commit
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER: ${{ matrix.launcher }}
        run: |
          if git diff --quiet -- launcher-versions.lock.json; then
            echo "the lock already matches the published installer"
            exit 0
          fi
          sensitive=$(jq -n --arg id "$LAUNCHER" \
            --slurpfile old <(git show HEAD:launcher-versions.lock.json) \
            --slurpfile new launcher-versions.lock.json \
            '[ $old[0].launchers[$id].authSalt != $new[0].launchers[$id].authSalt,
               $old[0].launchers[$id].apiBase != $new[0].launchers[$id].apiBase ] | any')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$sensitive" = "true" ]; then
            # Run the real build.rs rules on the new values, so the reviewer sees
            # the verdict instead of finding out at the next local build.
            if check=$(cargo check -p yayl-core --locked 2>&1); then
              verdict="build.rs accepts the new values."
            else
              verdict="build.rs REJECTS the new values: $(printf '%s\n' "$check" | grep -m1 -E '^[[:space:]]*launcher-versions\.lock\.json: ' || echo 'see the workflow log')"
            fi
            branch="launcher-lock/$LAUNCHER"
            body="The published $LAUNCHER installer carries a different authSalt or apiBase. $verdict Verify the new values before merging."
            git switch -c "$branch"
            git add launcher-versions.lock.json
            git commit -m "chore(deps): refresh $LAUNCHER in the launcher lock (needs review)" \
              -m "authSalt or apiBase changed. Both are compiled into every build: check them before merging."
            git push --force origin "$branch"
            if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
              gh pr create --head "$branch" --base "$GITHUB_REF_NAME" \
                --title "Launcher lock: $LAUNCHER auth salt or API host changed" \
                --body "$body" || {
                echo "::error::Could not open the PR. Branch $branch is pushed. Enable Settings > Actions > Allow GitHub Actions to create and approve pull requests, or open the PR by hand."
                exit 1
              }
            else
              gh pr edit "$branch" --body "$body"
            fi
            echo "::warning::$LAUNCHER authSalt/apiBase changed. $verdict PR: $branch"
            exit 0
          fi
          git add launcher-versions.lock.json
          git commit -m "chore(deps): refresh $LAUNCHER in the launcher lock" \
            -m "Read from the published installer: version, size and sha512."
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
